# Type-checks and builds the web app on every pull request that touches it.
name: Check web app

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-check.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
