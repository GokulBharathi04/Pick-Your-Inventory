# Publishes the web app (apps/web) to GitHub Pages whenever it changes on the
# `dev` branch, with the old HTML preview kept under /preview/. Both talk to
# the DEV Supabase project.
name: Deploy web app (Pages)

on:
  push:
    branches: [dev]
    paths:
      - "apps/web/**"
      - "apps/web-preview/**"
      - ".github/workflows/web-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the web app
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Put the site together
        run: |
          mkdir -p site
          cp -r apps/web/dist/. site/
          mkdir -p site/preview
          cp -r apps/web-preview/. site/preview/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
