# Publishes apps/web-preview (plain HTML, no build step) to GitHub Pages
# whenever it changes on the `dev` branch. It talks to the DEV Supabase project.
name: Deploy web preview (Pages)

on:
  push:
    branches: [dev]
    paths:
      - "apps/web-preview/**"
      - ".github/workflows/web-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web-preview
      - id: deployment
        uses: actions/deploy-pages@v4
