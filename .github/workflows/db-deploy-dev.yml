# Applies new migrations in supabase/migrations to the DEV Supabase project
# whenever they land on the `dev` branch.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   DEV_DB_PASSWORD        database password of the dev project
name: Deploy database (dev)

on:
  push:
    branches: [dev]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/db-deploy-dev.yml"
  workflow_dispatch:

concurrency:
  group: deploy-db-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ngfakbdneyluggrhijyq
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and DEV_DB_PASSWORD as repository secrets."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the dev project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending migrations
        run: supabase migration list

      - name: Apply migrations
        run: supabase db push
