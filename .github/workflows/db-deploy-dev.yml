# Applies new migrations in supabase/migrations to the DEV Supabase project,
# and deploys the Edge Functions in supabase/functions, whenever they land on
# the `dev` branch.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN_GIT  personal access token from supabase.com/dashboard/account/tokens
#   DEV_DB_PASSWORD            database password of the dev project
# The CLI reads the token from the SUPABASE_ACCESS_TOKEN environment variable,
# which is filled from the SUPABASE_ACCESS_TOKEN_GIT secret below.
name: Deploy database (dev)

on:
  push:
    branches: [dev]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/db-deploy-dev.yml"
  workflow_dispatch:

concurrency:
  group: deploy-db-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_GIT }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ngfakbdneyluggrhijyq
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN_GIT"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing DEV_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi
          echo "Both secrets are set."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the dev project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Newer CLI versions default some commands to the local stack, so the
      # remote target is always passed explicitly. Each command is asked which
      # flag it supports: `--remote` in current versions, `--linked` in older ones.
      - name: Show pending migrations
        run: |
          help=$(supabase migration list --help 2>&1)
          if grep -q -- '--remote' <<< "$help"; then flag=--remote
          elif grep -q -- '--linked' <<< "$help"; then flag=--linked
          else flag=""; fi
          supabase migration list $flag

      - name: Apply migrations
        run: |
          help=$(supabase db push --help 2>&1)
          if grep -q -- '--remote' <<< "$help"; then flag=--remote
          elif grep -q -- '--linked' <<< "$help"; then flag=--linked
          else flag=""; fi
          # --yes: this run is the deliberate deploy for a merge into dev, and
          # the CLI cannot ask for confirmation without a terminal.
          echo "Running: supabase db push $flag --yes"
          supabase db push $flag --yes

      - name: Deploy Edge Functions
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "${name#_}" != "$name" ] && continue   # skip shared folders such as _shared
            echo "Deploying $name"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          done
