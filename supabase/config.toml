# Supabase CLI configuration.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
# The GitHub integration reads this file when deploying. Migrations in ./migrations
# are applied automatically; auth and API settings here only affect local development.

project_id = "pick-your-inventory"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = true

# The new API keys are not JWTs, so this function checks the caller itself.
[functions.create-staff-user]
verify_jwt = false
